# Full model config — the planned final model (6 layers, 6 heads, 384 hidden).
# ~14M parameters. Used for the first full run on a 200,000-story TinyStories
# subset on Kaggle T4 x2, and as the baseline for the ablation experiments.
# Ablations change one field at a time: n_layer (2/4/6), n_head (1 vs 6),
# pos_type (learned vs sinusoidal), block_size (128/256/512).

seed: 42

model:
  vocab_size: 8000
  block_size: 256
  n_layer: 6
  n_head: 6
  n_embd: 384
  dropout: 0.1
  pos_type: learned   # "learned" or "sinusoidal"

data:
  dataset: tinystories
  max_train_stories: 200000
  max_val_stories: 2000
  tinyshakespeare_path: data/tinyshakespeare.txt

training:
  batch_size: 64
  max_steps: 8000
  learning_rate: 0.0003
  min_lr: 0.00003
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 500
  grad_clip: 1.0
  eval_interval: 500
  eval_iters: 50
  checkpoint_interval: 1000

paths:
  tokenizer: checkpoints/tokenizer.json
  checkpoint_dir: checkpoints
  log_dir: logs
  log_name: train_log.csv
