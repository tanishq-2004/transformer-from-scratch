# Tiny smoke-test config — 2 layers, 1 head, small vocab.
# Used for the CPU smoke test only: Tiny Shakespeare, 50 steps.
# Proves the code runs, loss decreases, and generation works,
# before any GPU time is spent.

seed: 42

model:
  vocab_size: 1000
  block_size: 128
  n_layer: 2
  n_head: 2
  n_embd: 128
  dropout: 0.0
  pos_type: learned

data:
  dataset: tinyshakespeare
  max_train_stories: null
  max_val_stories: null
  tinyshakespeare_path: data/tinyshakespeare.txt

training:
  batch_size: 16
  max_steps: 50
  learning_rate: 0.001
  min_lr: 0.0001
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_steps: 10
  grad_clip: 1.0
  eval_interval: 25
  eval_iters: 10
  checkpoint_interval: 50

paths:
  tokenizer: checkpoints/smoke_tokenizer.json
  checkpoint_dir: checkpoints
  log_dir: logs
  log_name: smoke_log.csv
